<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&N Açaí BES</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f3ff;
  color:#241633;
}

header{
  background:linear-gradient(135deg,#35105f,#7416a8,#d92c91);
  color:white;
  padding:32px 18px 42px;
  text-align:center;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px rgba(80,20,120,.25);
}

.logo{
  font-size:34px;
  font-weight:900;
}

.subtitle{
  margin-top:8px;
  font-size:15px;
  opacity:.9;
}

.info{
  margin-top:18px;
  font-size:13px;
  line-height:1.6;
}

.container{
  width:min(1100px,94%);
  margin:25px auto 110px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:22px;
}

.categories button{
  border:0;
  padding:11px 18px;
  border-radius:30px;
  background:white;
  color:#5d267b;
  font-weight:bold;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  white-space:nowrap;
  cursor:pointer;
}

.categories button.active{
  background:#68189a;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 7px 25px rgba(50,20,70,.09);
  border:1px solid #eee4f6;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card h2{
  font-size:20px;
  margin-bottom:8px;
}

.description{
  color:#71677a;
  font-size:13px;
  line-height:1.5;
  min-height:58px;
}

.price{
  color:#68189a;
  font-size:15px;
  font-weight:bold;
  margin:14px 0;
}

.card button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:13px;
  background:linear-gradient(135deg,#68189a,#a421b7);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,5,20,.7);
  z-index:1000;
  padding:18px;
  overflow:auto;
}

.modal{
  background:white;
  max-width:520px;
  margin:30px auto;
  border-radius:25px;
  padding:24px;
  position:relative;
}

.close{
  position:absolute;
  right:17px;
  top:14px;
  border:0;
  background:#eee;
  width:34px;
  height:34px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.modal h2{
  padding-right:45px;
  margin-bottom:8px;
}

.modal-description{
  color:#766b80;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

.option-title{
  font-size:14px;
  font-weight:bold;
  margin:18px 0 9px;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.option{
  border:1px solid #ddd;
  background:#fff;
  padding:11px;
  border-radius:12px;
  cursor:pointer;
  text-align:left;
}

.option.selected{
  border-color:#7416a8;
  background:#f4e8fb;
  color:#5d167c;
  font-weight:bold;
}

.addon{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:13px;
  margin-top:8px;
  cursor:pointer;
}

.addon input{
  width:18px;
  height:18px;
}

.total-modal{
  margin-top:22px;
  padding:15px;
  background:#f6effb;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.confirm{
  width:100%;
  margin-top:14px;
  border:0;
  padding:15px;
  border-radius:14px;
  background:#25d366;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:900;
  border:0;
  background:#68189a;
  color:white;
  padding:15px 20px;
  border-radius:40px;
  box-shadow:0 8px 25px rgba(60,10,90,.3);
  font-weight:bold;
  cursor:pointer;
}

.cart-count{
  background:#ff3c91;
  padding:3px 7px;
  border-radius:20px;
  margin-left:5px;
}

.cart-box{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,5,20,.7);
  z-index:1100;
  padding:18px;
  overflow:auto;
}

.cart-content{
  max-width:520px;
  margin:30px auto;
  background:white;
  border-radius:25px;
  padding:24px;
}

.cart-item{
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.cart-item strong{
  display:block;
  margin-bottom:5px;
}

.details{
  color:#766b80;
  font-size:12px;
  line-height:1.5;
}

.item-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:9px;
}

.item-actions button{
  border:0;
  background:#eee;
  width:30px;
  height:30px;
  border-radius:8px;
  cursor:pointer;
}

.cart-total{
  margin-top:20px;
  font-size:19px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.whatsapp{
  width:100%;
  border:0;
  padding:15px;
  margin-top:15px;
  background:#25d366;
  color:white;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 0;
}

@media(max-width:500px){
  .logo{
    font-size:29px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🍇 D&N Açaí BES</div>
  <div class="subtitle">Seu momento doce começa aqui 💜</div>

  <div class="info">
    📍 Rua Expedicionário Mário Fernandes, 57<br>
    🚚 Delivery disponível<br>
    📲 Faça seu pedido pelo WhatsApp
  </div>
</header>

<div class="container">

  <div class="categories">
    <button class="active" onclick="filtrar('todos',this)">Todos</button>
    <button onclick="filtrar('acai',this)">Açaí</button>
    <button onclick="filtrar('milk',this)">Milk-Shake</button>
  </div>

  <div class="grid" id="produtos"></div>

</div>

<button class="cart" onclick="abrirCarrinho()">
  🛒 Carrinho
  <span class="cart-count" id="contador">0</span>
</button>

<!-- MODAL PRODUTO -->

<div class="modal-bg" id="modalBg">
  <div class="modal">

    <button class="close" onclick="fecharModal()">×</button>

    <h2 id="modalTitulo"></h2>
    <div class="modal-description" id="modalDescricao"></div>

    <div id="configuracao"></div>

    <div class="total-modal">
      <span>Total</span>
      <span id="modalPreco">R$ 0,00</span>
    </div>

    <button class="confirm" onclick="adicionarCarrinho()">
      🛒 Adicionar ao carrinho
    </button>

  </div>
</div>

<!-- CARRINHO -->

<div class="cart-box" id="cartBox">

  <div class="cart-content">

    <button class="close" onclick="fecharCarrinho()">×</button>

    <h2>🛒 Seu pedido</h2>

    <div id="listaCarrinho"></div>

    <div class="cart-total">
      <span>Total</span>
      <span id="totalCarrinho">R$ 0,00</span>
    </div>

    <button class="whatsapp" onclick="enviarWhatsApp()">
      📲 Enviar pedido pelo WhatsApp
    </button>

  </div>

</div>

<script>

const WHATSAPP = "5516996194221";

const produtos = [

{
 nome:"Trufado de Paçoquinha",
 categoria:"acai",
 descricao:"Açaí ou sorvete, trufado de Nutella, pasta de amendoim, leite condensado e paçoca.",
 precos:{300:28,400:33,500:41}
},

{
 nome:"Kinder Bueno White",
 categoria:"acai",
 descricao:"Açaí ou sorvete, creme de Ninho Original, Nutella pura, Kinder Bueno White, leite condensado e Ninho em pó.",
 precos:{300:34,400:43,500:58}
},

{
 nome:"Copo Tropical",
 categoria:"acai",
 descricao:"Açaí ou sorvete, leite condensado, Ninho em pó, Nutella pura, morango, banana e uvas verdes.",
 precos:{300:28,400:33,500:38}
},

{
 nome:"Copo Tradicional",
 categoria:"acai",
 descricao:"Açaí ou sorvete, Nutella, leite condensado, fruta, Ninho em pó e granola ou amendoim.",
 precos:{300:23,400:28,500:35},
 frutas:true,
 granola:true
},

{
 nome:"Oreotella",
 categoria:"acai",
 descricao:"Açaí ou sorvete, trufado de Nutella, leite condensado, Ninho em pó, Oreo, Bis e Biju.",
 precos:{400:43,500:58}
},

{
 nome:"Copo Paçoquinha",
 categoria:"acai",
 descricao:"Açaí ou sorvete, paçoquinha, leite condensado e pasta de amendoim.",
 precos:{300:23,400:28,500:35}
},

{
 nome:"Batidinha de Açaí",
 categoria:"acai",
 descricao:"Açaí batido com leite condensado. Escolha Ninho em pó ou Paçoca.",
 precos:{300:14,400:16,500:18,780:21},
 batidinha:true
},

{
 nome:"Trufado Flocos Ovomaltine",
 categoria:"acai",
 descricao:"Açaí ou sorvete, trufado de Nutella, flocos de Ovomaltine, bombom Ouro Branco, leite condensado e Ninho em pó.",
 precos:{300:28,400:33,500:41}
},

{
 nome:"Copo Trufado",
 categoria:"acai",
 descricao:"Açaí ou sorvete, trufado de Nutella, Ninho em pó, granola ou amendoim, fruta e leite condensado.",
 precos:{300:28,400:33,500:41},
 frutas:true,
 granola:true
},

{
 nome:"Dois Amores",
 categoria:"acai",
 descricao:"Açaí ou sorvete, creme de Ninho Original, Nutella pura, leite condensado e Ninho em pó.",
 precos:{300:28,400:36,500:42}
},

{
 nome:"Copo Vulcão",
 categoria:"acai",
 descricao:"Açaí ou sorvete, leite condensado, Ninho em pó e fruta.",
 precos:{300:23,400:28,500:35},
 frutas:true
},

{
 nome:"Copo Napolitano",
 categoria:"acai",
 descricao:"Açaí ou sorvete, leite condensado, Ninho em pó, creme Leitinho, creme de chocolate e creme de morango.",
 precos:{300:25,400:30,500:38}
},

{
 nome:"Copo Wafer",
 categoria:"acai",
 descricao:"Açaí ou sorvete, Ninho em pó, creme de wafer e morango.",
 precos:{300:23,400:28,500:35}
},

{
 nome:"Copo 200ml",
 categoria:"acai",
 descricao:"Açaí ou sorvete, Ninho em pó, leite condensado, 1 creme e 1 fruta à escolha.",
 precos:{200:18},
 copo200:true
},

{
 nome:"Copo Moranguete",
 categoria:"acai",
 descricao:"Creme de morango de um lado, creme de Nutella do outro e açaí no meio.",
 precos:{300:28,400:36,500:42}
},

{
 nome:"Milk-Shake",
 categoria:"milk",
 descricao:"Escolha seu sabor e tamanho.",
 precos:{300:14,400:16,500:18,770:22},
 milk:true
}

];

const saboresMilk = [
"Abacaxi suíço",
"Abacaxi ao vinho",
"Bombom",
"Chocolate",
"Chocolate Branco",
"Flocos",
"Frutas vermelhas",
"Maracujá trufado",
"Morango",
"Ninho trufado",
"Ovomaltine",
"Paçoquinha",
"Unicórnio"
];

const cremes200 = [
"Creme de Ninho",
"Leitinho",
"Wafer branco",
"Creme de chocolate",
"Pasta de amendoim",
"Chocolate",
"Creme de morango",
"Avelã"
];

const frutas = [
"Morango",
"Banana",
"Uvas verdes"
];

let carrinho = [];
let produtoAtual = null;
let config = {};

function dinheiro(valor){
  return valor.toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });
}

function renderProdutos(filtro="todos"){

  const area = document.getElementById("produtos");

  const lista = produtos.filter(p =>
    filtro === "todos" || p.categoria === filtro
  );

  area.innerHTML = "";

  lista.forEach((p,index)=>{

    const precos = Object.entries(p.precos)
      .map(([tamanho,preco]) => `${tamanho}ml ${dinheiro(preco)}`)
      .join(" • ");

    area.innerHTML += `
      <div class="card">

        <h2>${p.nome}</h2>

        <div class="description">
          ${p.descricao}
        </div>

        <div class="price">
          ${precos}
        </div>

        <button onclick="abrirProduto(${produtos.indexOf(p)})">
          Escolher
        </button>

      </div>
    `;
  });
}

function filtrar(tipo,botao){

  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

  botao.classList.add("active");

  renderProdutos(tipo);
}

function abrirProduto(index){

  produtoAtual = produtos[index];

  config = {
    tamanho:Object.keys(produtoAtual.precos)[0],
    base:"Açaí",
    fruta:"",
    creme:"",
    complemento:"",
    sabor:"",
    nutella:false
  };

  document.getElementById("modalTitulo").innerText =
    produtoAtual.nome;

  document.getElementById("modalDescricao").innerText =
    produtoAtual.descricao;

  montarConfiguracao();

  document.getElementById("modalBg").style.display="block";

  atualizarPreco();
}

function montarConfiguracao(){

  const area = document.getElementById("configuracao");

  let html="";

  html += `<div class="option-title">Tamanho</div>`;
  html += `<div class="options">`;

  Object.keys(produtoAtual.precos).forEach(tamanho=>{

    html += `
      <button class="option ${config.tamanho==tamanho?'selected':''}"
      onclick="selecionar('tamanho','${tamanho}')">
        ${tamanho}ml<br>
        ${dinheiro(produtoAtual.precos[tamanho])}
      </button>
    `;
  });

  html += `</div>`;

  if(!produtoAtual.milk){

    html += `<div class="option-title">Base</div>`;
    html += `<div class="options">`;

    ["Açaí","Sorvete"].forEach(base=>{

      html += `
        <button class="option ${config.base===base?'selected':''}"
        onclick="selecionar('base','${base}')">
          ${base}
        </button>
      `;
    });

    html += `</div>`;
  }

  if(produtoAtual.milk){

    html += `<div class="option-title">Sabor do Milk-Shake</div>`;
    html += `<div class="options">`;

    saboresMilk.forEach(sabor=>{

      html += `
        <button class="option ${config.sabor===sabor?'selected':''}"
        onclick="selecionar('sabor','${sabor}')">
          ${sabor}
        </button>
      `;
    });

    html += `</div>`;
  }

  if(produtoAtual.batidinha){

    html += `<div class="option-title">Escolha o complemento</div>`;
    html += `<div class="options">`;

    ["Ninho em pó","Paçoca"].forEach(opcao=>{

      html += `
        <button class="option ${config.complemento===opcao?'selected':''}"
        onclick="selecionar('complemento','${opcao}')">
          ${opcao}
        </button>
      `;
    });

    html += `</div>`;
  }

  if(produtoAtual.frutas){

    html += `<div class="option-title">Escolha a fruta</div>`;
    html += `<div class="options">`;

    frutas.forEach(fruta=>{

      html += `
        <button class="option ${config.fruta===fruta?'selected':''}"
        onclick="selecionar('fruta','${fruta}')">
          ${fruta}
        </button>
      `;
    });

    html += `</div>`;
  }

  if(produtoAtual.granola){

    html += `<div class="option-title">Complemento</div>`;
    html += `<div class="options">`;

    ["Granola","Amendoim"].forEach(opcao=>{

      html += `
        <button class="option ${config.complemento===opcao?'selected':''}"
        onclick="selecionar('complemento','${opcao}')">
          ${opcao}
        </button>
      `;
    });

    html += `</div>`;
  }

  if(produtoAtual.copo200){

    html += `<div class="option-title">Escolha 1 creme</div>`;
    html += `<div class="options">`;

    cremes200.forEach(creme=>{

      html += `
        <button class="option ${config.creme===creme?'selected':''}"
        onclick="selecionar('creme','${creme}')">
          ${creme}
        </button>
      `;
    });

    html += `</div>`;

    html += `<div class="option-title">Escolha 1 fruta</div>`;
    html += `<div class="options">`;

    frutas.forEach(fruta=>{

      html += `
        <button class="option ${config.fruta===fruta?'selected':''}"
        onclick="selecionar('fruta','${fruta}')">
          ${fruta}
        </button>
      `;
    });

    html += `</div>`;

    html += `
      <div class="option-title">Adicional</div>

      <label class="addon">

        <input type="checkbox"
        ${config.nutella ? "checked" : ""}
        onchange="config.nutella=this.checked; atualizarPreco()">

        <span>
          🍫 Adicionar Nutella
          <strong>+R$ 2,00</strong>
        </span>

      </label>
    `;
  }

  area.innerHTML=html;
}

function selecionar(campo,valor){

  config[campo]=valor;

  montarConfiguracao();

  atualizarPreco();
}

function atualizarPreco(){

  let preco = produtoAtual.precos[config.tamanho];

  if(produtoAtual.copo200 && config.nutella){
    preco += 2;
  }

  document.getElementById("modalPreco").innerText =
    dinheiro(preco);
}

function validarProduto(){

  if(produtoAtual.milk && !config.sabor){
    alert("Escolha o sabor do Milk-Shake.");
    return false;
  }

  if(produtoAtual.batidinha && !config.complemento){
    alert("Escolha Ninho em pó ou Paçoca.");
    return false;
  }

  if(produtoAtual.frutas && !config.fruta){
    alert("Escolha a fruta.");
    return false;
  }

  if(produtoAtual.copo200){

    if(!config.creme){
      alert("Escolha 1 creme.");
      return false;
    }

    if(!config.fruta){
      alert("Escolha 1 fruta.");
      return false;
    }
  }

  return true;
}

function adicionarCarrinho(){

  if(!validarProduto()) return;

  let preco = produtoAtual.precos[config.tamanho];

  if(produtoAtual.copo200 && config.nutella){
    preco += 2;
  }

  const detalhes=[];

  if(produtoAtual.milk)
    detalhes.push(`Sabor: ${config.sabor}`);

  if(!produtoAtual.milk)
    detalhes.push(`Base: ${config.base}`);

  if(config.fruta)
    detalhes.push(`Fruta: ${config.fruta}`);

  if(config.creme)
    detalhes.push(`Creme: ${config.creme}`);

  if(config.complemento)
    detalhes.push(`Complemento: ${config.complemento}`);

  if(produtoAtual.copo200 && config.nutella)
    detalhes.push(`Adicional: Nutella +R$ 2,00`);

  carrinho.push({
    nome:produtoAtual.nome,
    tamanho:config.tamanho,
    preco:preco,
    detalhes:detalhes
  });

  atualizarCarrinho();

  fecharModal();
}

function atualizarCarrinho(){

  document.getElementById("contador").innerText =
    carrinho.length;

  const lista=document.getElementById("listaCarrinho");

  if(carrinho.length===0){

    lista.innerHTML=
      `<div class="empty">Seu carrinho está vazio.</div>`;

    document.getElementById("totalCarrinho").innerText =
      dinheiro(0);

    return;
  }

  lista.innerHTML="";

  let total=0;

  carrinho.forEach((item,index)=>{

    total += item.preco;

    lista.innerHTML += `

      <div class="cart-item">

        <strong>
          ${index+1}. ${item.nome} — ${item.tamanho}ml
        </strong>

        <div class="details">
          ${item.detalhes.join("<br>")}
        </div>

        <div class="item-actions">

          <span>${dinheiro(item.preco)}</span>

          <button onclick="removerItem(${index})">
            🗑️
          </button>

        </div>

      </div>
    `;
  });

  document.getElementById("totalCarrinho").innerText =
    dinheiro(total);
}

function removerItem(index){

  carrinho.splice(index,1);

  atualizarCarrinho();
}

function abrirCarrinho(){

  atualizarCarrinho();

  document.getElementById("cartBox").style.display="block";
}

function fecharCarrinho(){

  document.getElementById("cartBox").style.display="none";
}

function fecharModal(){

  document.getElementById("modalBg").style.display="none";
}

function enviarWhatsApp(){

  if(carrinho.length===0){

    alert("Adicione algum produto ao carrinho primeiro.");
    return;
  }

  let mensagem =
    "🍇 *NOVO PEDIDO — D&N AÇAÍ BES*%0A%0A";

  let total=0;

  carrinho.forEach((item,index)=>{

    total += item.preco;

    mensagem +=
      `*${index+1}. ${item.nome} — ${item.tamanho}ml*%0A`;

    item.detalhes.forEach(detalhe=>{

      mensagem += `• ${detalhe}%0A`;

    });

    mensagem +=
      `💰 ${dinheiro(item.preco)}%0A%0A`;
  });

  mensagem +=
    `*TOTAL: ${dinheiro(total)}*%0A%0A`;

  mensagem +=
    "Olá! Gostaria de confirmar este pedido. 😊";

  window.open(
